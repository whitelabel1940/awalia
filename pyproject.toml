[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cbs-partner"
version = "0.1.0"
description = "Awalia: a local app for growing a relationship with an AI partner"
license = "AGPL-3.0-only"
requires-python = ">=3.14"
dependencies = ["fastapi", "uvicorn", "pydantic>=2", "pyyaml", "google-genai", "openai", "httpx", "pytest", "pillow", "cryptography", "regex"]

[project.optional-dependencies]
local-embedding = ["onnxruntime>=1.24", "tokenizers>=0.22", "numpy>=2"]

[tool.setuptools.packages.find]
include = ["cbs*"]

[tool.setuptools.package-data]
cbs = ["prompts/*.md", "look_fields.yaml", "web/static/*", "web/static/brand/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
