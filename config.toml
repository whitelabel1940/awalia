daily_max = 1
domains = ["amazon.co.jp", "rakuten.co.jp", "makuake.com", "camp-fire.jp", "readyfor.jp"]

[inner]
baseline_hours = 12
want_decay_per_day = 0.1
long_gap_hours = 24
show_monologue = true

# EX1: optional proactive topics during the first calendar days; caps are not goals.
[early]
notify = true
days = 3
daily_max = 1
total_max = 3

# M10: voice is opt-in; autoplay is on when voice is enabled.
[tts]
duration_scale = 0.8 # UI4 bench: 1.0 adds stray speech (102 chars in 80 clips), 0.8 removes it (15, mostly "あっ"), 0.7 starts clipping word ends.
local_model = "auto" # GPU: q8_0, CPU: q4_k. Explicit q8_0 / q4_k also supported.
enabled = false
autoplay = true
autoplay_proactive = false # Speak-ups are not read aloud by default; the notice and bubble still appear.
engine = "speech.cpp"
base_url = "http://127.0.0.1:8080/v1"
model = ""
device = "auto"
cache_days = 7

[tts.styles."speech.cpp"]
mode = "emoji"
[tts.styles."speech.cpp".values]
neutral = ""
smile = "😊"
shy = "😳"
surprised = "😮"
sad = "😢"
troubled = "😟"
thinking = "🤔"
pout = "😠"

[tts.styles.external]
mode = "none"
[tts.styles.external.values]
neutral = ""
smile = "明るく、笑顔で話す"
shy = "少し照れながら話す"
surprised = "驚いた調子で話す"
sad = "悲しげに話す"
troubled = "困った調子で話す"
thinking = "考えながら話す"
pout = "少しすねた調子で話す"

# AD1: 継続的なお願いの保存上限（意味の判定はLLM）
[requests]
max_lines = 40
max_line_chars = 300
max_field_chars = 1000

# HB1: 日付・時刻の規則。意味と言い方は既存のExtract/proactiveが判断する。
[days]
nearby_days = 14
hundred_days = true
yearly = true
habit_window_minutes = 15

[backup]
# BK2: upload (2 GiB) and total expanded archive (8 GiB) limits.
restore_max_bytes = 2147483648
restore_max_expanded_bytes = 8589934592
daily_keep = 7
weekly_keep = 4
export_keep = 4
folder = ""
frequency = "off"

[photos]
max_count = 4
max_edge = 1600
max_bytes = 20971520
max_pixels = 40000000

[photos.candidates]
"gemini/gemini-3.8-flash" = true
"openrouter/google/gemini-3.8-flash" = true
"anthropic/claude-haiku-5-5" = true
"openai/gpt-6.1-sol" = true

# VO1: audio capability is explicit; unknown models are disabled.
[stt]
auto_send = false
max_seconds = 60
silence_seconds = 2.0
silence_rms = 0.015
device = "auto"
[stt.candidates]
"openrouter/google/gemini-3.8-flash" = true
"gemini/gemini-3.8-flash" = true
"openai/gpt-4o-mini-transcribe" = true
# speech pull owns model paths, resume and SHA-256 verification.
[stt.local_models.haas-ja]
catalog = "haas-ja-v1.0"
size = 660000000
[first_run]
keep = 5
[display]
split_replies = true
delay_user = false
read_seconds = 1.2
typing_seconds = 2.5
user_delay_seconds = 1.0
bubble_max_seconds = 1.5
split_min_chars = 50
split_three_chars = 140

