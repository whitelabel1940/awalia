[llm]
# 新規はかんたん設定。保存済み [models] があれば従来の詳細設定を維持する。
mode = "simple"
provider = "gemini"
api_key_env = "GEMINI_API_KEY"
# この環境の CA は Basic Constraints の critical フラグがなく Python 3.14 の strict 検査で失敗する。
# CA 信頼チェーン・ホスト名の検証は維持する。通常の環境では true（既定値）に戻す。
tls_strict = false

# judge は 3.5-flash-lite だと観測領域の取り違えが多かった（reports/probes_M1_*）。3.8-flash の low で約3秒
[llm.thinking.judge]
thinking_level = "low"

[llm.thinking.steward]
thinking_level = "low"

[llm.thinking.actor]
thinking_level = "low"

# 追加プロバイダ。[models] では "<名前>/<モデル>" で指定する（名前なしは上の provider = gemini）
[llm.providers.openai]
api = "responses"
api_key_env = "GPT_API_KEY"
reasoning_effort = { actor = "low", judge = "low", steward = "low" }

[llm.providers.anthropic]
api = "messages"
api_key_env = "ANTHROPIC_API_KEY"

[llm.providers.openrouter]
api = "chat"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
reasoning_effort = { actor = "low", judge = "low", steward = "low" }

# ローカル LLM（Ollama / LM Studio 等の OpenAI 互換サーバ）を使う場合の例:
# [llm.providers.local]
# api = "chat"
# base_url = "http://localhost:11434/v1"

[models]
actor = "gemini-3.8-flash"
# 判断層（Pre-Judge / Post-Check）は GPT-6 Luna（Decision Model 研究で精度・価格とも最良）
judge = "openai/gpt-6-luna"
steward = "gemini-3.8-flash"
embedding = "gemini-embedding-2"
# research 未指定時は steward と同じモデルを使用
research = "gemini-3.8-flash"
vision = "gemini-3.8-flash"
stt = "gemini/gemini-3.8-flash"

[simple.models]
actor = "openrouter/google/gemini-3.8-flash"
judge = "openrouter/openai/gpt-6-luna"
steward = "openrouter/openai/gpt-6-luna"
embedding = "openrouter/google/gemini-embedding-2"
research = "openrouter/google/gemini-3.8-flash"
vision = "openrouter/google/gemini-3.8-flash"
stt = "openrouter/google/gemini-3.8-flash"

# S2: provisional advanced choices; quality approval remains with Opus/user.
[[advanced.presets]]
id = "mixed"
label = "複数の AI を組み合わせて使う（推奨）"
description = "OpenRouter のキーひとつで、役ごとに AI を組み合わせます。"
models = { actor = "openrouter/google/gemini-3.8-flash", judge = "openrouter/openai/gpt-6-luna", steward = "openrouter/openai/gpt-6-luna", embedding = "openrouter/google/gemini-embedding-2", research = "openrouter/google/gemini-3.8-flash", vision = "openrouter/google/gemini-3.8-flash", stt = "openrouter/google/gemini-3.8-flash" }

[[advanced.presets]]
id = "gemini"
label = "Gemini だけで使う"
models = { actor = "gemini/gemini-3.8-flash", judge = "gemini/gemini-3.8-flash", steward = "gemini/gemini-3.5-flash-lite", embedding = "gemini/gemini-embedding-2", research = "gemini/gemini-3.8-flash", vision = "gemini/gemini-3.8-flash", stt = "gemini/gemini-3.8-flash" }

[[advanced.presets]]
id = "claude"
label = "Claude だけで使う"
description = "記憶の検索は手元のモデルを使います（初回に取得が要ります）。会話の質を上げたい時は、会話のモデルを Claude Sonnet に変えられます（費用は約4倍）。"
