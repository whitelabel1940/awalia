[autonomy]
source_refresh_hours = 24
activities_daily_max = 6
inner_life_interval_hours = 4
research = true
research_candidate_expiry_days = 14
research_candidate_max = 12
thread_expiry_days = 14
proactive_history_days = 3 # 会話の区切りをまたいで、既に話した内容を検索する日数
idle_nudge = false
resident_expression_neutral_minutes = 10 # 返答の表情から内面（なければふつう）へ戻るまでの分数
idle_poll_seconds = 180 # 常駐画面だけで idle を確認する間隔（60〜3600秒）
resident_opening_delay_seconds = 90 # 非表示の常駐起動から挨拶を判断するまで（0〜3600秒）
# 間が空いた時の話しかけ: 頻度（opening）ごとの間（分）と1日の上限
idle_pace = { many = { minutes = 20, daily_max = 6 }, normal = { minutes = 30, daily_max = 4 }, reserved = { minutes = 90, daily_max = 2 } }
quiet_start_hour = 0
quiet_end_hour = 8

[autonomy.tools.research]
enabled = true
daily_max = 3

[autonomy.tools.read_source]
enabled = true
daily_max = 3

[autonomy.tools.read_book]
