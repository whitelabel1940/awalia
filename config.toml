[costs]
detail_days = 90
pause_autonomy = false
# monthly_guide_usd = 5.0  # 任意、USD。未設定なら知らせ・停止なし。
# 100万トークンあたりUSD。既存候補（2026-10-15）の目安を継承。
# 直接接続の料金は提供元の画面で確認して更新する。未登録は「不明」。
# cache_read_usd / cache_write_usd は任意。キャッシュ使用時に単価未登録なら不明。
# OpenRouterはこの表を使わず usage.cost、localは常に0。
[costs.prices."gemini/gemini-3.8-flash"]
input_usd = 0.825
output_usd = 4.125
[costs.prices."gemini/gemini-3.5-flash-lite"]
input_usd = 0.30
output_usd = 2.50
[costs.prices."anthropic/claude-sonnet-5.5"]
input_usd = 2.0
output_usd = 10.0
[costs.prices."anthropic/claude-haiku-5-5"]
input_usd = 0.10
output_usd = 0.50
[costs.prices."openai/gpt-6-luna"]
input_usd = 0.10
output_usd = 0.50
# 追加例（料金は契約に合わせて設定）:
# [costs.prices."openai/your-model"]
# input_usd = 1.0
# output_usd = 5.0
# cache_read_usd = 0.1

[memory]
candidate_max = 32
# Combined Pre-Judge pool; unused allotments return to the similarity ranking.
candidate_min_per_kind = { memory = 4, fact = 4, canon = 2, plan = 2, episode = 2, thread = 2, digest = 2, interest = 2, understanding = 2 }
# 今の層: 会話由来の好み・関心が「定着」する条件（別々の日の回数と、最初から最後までの日数）、薄れるまでの日数
interest_established_min_days = 3
interest_established_min_span_days = 7
interest_fade_days = 45
gap_minutes = 30
day_boundary_hour = 4
max_exchanges = 40
digest_age_days = 60
digest_strength_threshold = 0.2
# アーカイブ済みの元エピソードは、その発言と全記憶の類似度の平均より archived_margin 以上高い時だけ候補に戻る
# （gemini-embedding-2 では無関係 0.49〜0.57、関連 0.59〜0.71 程度。絶対値 0.8 では戻らなかった）
archived_margin = 0.08
# 手元のモデルは cbs/llm/local.py のモデル別既定値（ruri-v3-130m: 0.06）を使う。
# 個別に上書きする場合: [memory.archived_margins] の "local/ruri-v3-130m" = 0.06

