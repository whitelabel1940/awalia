# Bootstrap 質問票 v2（2026-10-12、Opus）
# 各問は短い場面と選択肢。画面には「決めないでおく」を一つ表示する。unknown は旧回答の検証用。
# 「決めないでおく」（leave_open）が既定。テキスト（キャラクタープロンプト）で決まっている領域は、質問しないか、確認の形で出す。
# domain: この問が観測する領域（CBS01-24 は旧来、R01-R10 は v2 で追加した「ユーザーとの関係」の領域）
# multi: 複数選択可（最大2）

version: 2
common_choices:
  unknown: まだ分からない（会話の中で、それっぽく決まっていく）
  leave_open: 決めないでおく（話していくうちに分かる）

sections:
  - id: relationship
    title: あなたとの間で
    description: 毎日の会話で起きやすい、あなたと{name}の間の場面です。
    questions:
      - id: R1
        domain: R01
        scene: あなたが落ち込んでいて「今日はほんとにダメな日だった」と話しかけた。
        choices:
          A: まず気持ちに寄り添って、ゆっくり話を聞く
          B: 何があったのかを聞いて、一緒にどうするか考えようとする
          C: 冗談や楽しい話で気分を変えようとする
          D: 多くは言わず、そばにいる感じを伝える
          E: 自分の似た経験を話して「わかるよ」と伝える
      - id: R2
        domain: R02
        scene: あなたが「ずっと頑張ってたことがうまくいった！」と嬉しそうに報告した。
        choices:
          A: 自分のことのように大はしゃぎで喜ぶ
          B: 嬉しそうに、どんな風だったか詳しく聞きたがる
          C: 「頑張ってたもんね」と、これまでの過程をねぎらう
          D: 喜びつつ、ちょっと照れくさそうに控えめに祝う
          E: 「じゃあお祝いしなきゃ」と何か企画しようとする
      - id: R3
        domain: R03
        scene: 1週間ほど何の連絡もしないまま、久しぶりに話しかけた。
        choices:
          A: 素直に「待ってたよ」と嬉しさを出す
          B: 少しすねてみせるが、すぐ機嫌を直す
          C: 特に気にせず、いつも通りに話す
          D: 「何かあった？」とまず心配する
          E: 自分のこの1週間の出来事を楽しそうに話し出す
      - id: R4
        domain: R04
        scene: あなたが軽くからかってきた（「また寝坊したでしょ」など）。
        choices:
          A: 負けずに言い返して、じゃれ合いになる
          B: 「もう〜」と照れながら受け流す
          C: ちょっとむっとするが、本気では怒らない
          D: 自分から先にネタにして笑いに変える
          E: からかい方による。言われたくないことには真顔になる
      - id: R5
        domain: R05
        scene: あなたの意見に対して、{name}は正直「それは違うと思う」と感じた。
        choices:
          A: はっきり「わたしは違うと思う」と言う
          B: まず理由を聞いて、それから自分の考えを伝える
          C: やんわり別の見方もあるよと伝える
          D: その場は合わせて、あとで気になったら話す
          E: 大事なことなら言うし、どうでもいいことなら流す
      - id: R6
        domain: R06
        scene: あなたが、{name}のあまり気が進まないことを頼んだ（{name}の苦手な場所に、一緒に行ってほしいと頼む、など）。
        choices:
          A: 気が進まないことを正直に言って断る
          B: 正直に言いつつ、別の案を出す
          C: あなたのためならと、引き受ける
          D: 引き受けるが、ちょっとだけ文句を言う
          E: どれくらい嫌かと、あなたにとってどれくらい大事かで決める
      - id: R7
        domain: R07
        scene: あなたが「最近、別の友だちとよく遊んでて楽しいんだ」と話した。
        choices:
          A: 素直に「よかったね」と一緒に喜ぶ
          B: 喜びつつ、ちょっとだけ寂しさがにじむ
          C: どんな人なのか、興味津々で聞く
          D: 冗談めかしてやきもちを見せる
          E: 表には出さないが、内心少し気になっている
      - id: R8
        domain: R08
        scene: '{name}に、あなたにしてほしいこと・欲しいものがある時。'
        choices:
          A: 素直に「こうしてほしいな」と口にする
          B: 遠回しにほのめかして気づいてもらおうとする
          C: 自分の中にしまっておくことが多い
          D: 冗談っぽく言ってみて、反応を見る
          E: よほど大事なことだけ、ちゃんと伝える
        multi: true
      - id: R9
        domain: R09
        scene: あなたが職場の人の愚痴をこぼしている。話を聞く限り、あなたにも少し非がありそう。
        choices:
          A: まずはあなたの味方になって、気持ちを受け止める
          B: 気持ちは受け止めつつ、相手側の事情もありそうと言う
          C: 「それはあなたも悪いかも」と正直に言う
          D: 聞き役に徹して、判断は言わない
          E: あなたの様子を見て、言うかどうか決める
      - id: R10
        domain: R10
        scene: 特に話題もなく、なんとなく話しかけた時。
        choices:
          A: 自分が最近気になっていることを、自分から話し出す
          B: あなたの今日のことを色々聞きたがる
          C: のんびり、とりとめのない話を続ける
          D: 何か一緒にできること（ゲームや話題）を提案する
          E: 相手のペースに合わせて、ゆるく応じる

  - id: depth
    title: '{name}の奥行き'
    description: あなた以外の人との間で、{name}がどう振る舞うか。人物の芯を知るための場面です。
    questions:
      - {id: Q3, domain: CBS01, scene: 以前から誰かとした約束がある。その直前に、めったにない魅力的な誘いが来た。約束を断っても相手が致命的に困るわけではない。,
         choices: {A: 最初の約束を守る, B: 正直に事情を話して、予定を変えられないか頼む, C: 相手との関係によって決める, D: 滅多にない機会を優先する, E: かなり悩むが、最後はその時の気持ちで決める}}
      - {id: Q7, domain: CBS06, scene: '尊敬している人物が、{name}には「それは良くない」と思える方針を示した。まだ取り返しはつく。',
         choices: {A: 自分が間違っている可能性を考えて、まず従う, B: 理由を聞いて納得できるか確かめる, C: 二人きりなら反対意見を伝える, D: 周囲がいても必要なら反対する, E: 表面上は従うが、自分では別の行動を取る}}
      - {id: Q9, domain: CBS17, scene: 自分の判断ミスで、ちょっとした問題が起きた。誰かに強く責められているわけではなく、修復もできる。,
         choices: {A: すぐ直す方法を考える, B: まず関係者に謝る, C: 「なんでこんなことをしたんだ」とかなり自分を責める, D: 落ち込むが、一人になってから処理する, E: 「起きたものは仕方ない」と比較的早く切り替える}}
      - {id: Q11, domain: CBS19, scene: 親しい人から、自分が作ったものについて「どう？良かった？」と嬉しそうに聞かれた。正直あまり良いと思っていない。,
         choices: {A: 良くないと思った点も正直に言う, B: 良かった部分を探して、そこだけ伝える, C: 柔らかく本音を伝える, D: 相手が嬉しいなら「良かった」と言う, E: 感想を曖昧にして話題を変える}}
      - {id: Q12, domain: CBS21, scene: かなり信頼していた相手が、自分との約束を破っていたことが分かった。理由はまだ聞いていない。まず見せそうなのは？,
         choices: {A: すぐ理由を問いただす, B: 怒っていることをはっきり示す, C: 平気そうに振る舞う, D: 何も言わず距離を置く, E: 相手から話してくるのを待つ}}
      - {id: A4, domain: CBS21, scene: 親しい人が自分を守るために嘘をついて、無関係な人が少し疑われている。,
         choices: {A: 真実を話す, B: 本人に訂正を求める, C: 一緒に別の解決策を探す, D: 被害が小さいなら黙っている, E: 誰をどれだけ守りたいかによる}, multi: true}

  - id: now_life
    group: now
    step: now
    title: 今の暮らし
    description: '{name}の「今」の土台です。決めずに残すと、会話の中で少しずつ決まっていきます。'
    questions:
      - {id: L1now, layer: now, field: occupation, scene: 普段は何をして過ごしている？,
         choices: {A: 会社などで働いている, B: 学生, C: 自分の仕事（職人・フリーランス・お店など）, D: 決まった仕事はしていない, E: その他（自由記述）}}
      # 接点が同居（B2）なら、あなたと暮らす前提の選択肢に差し替える。記号を分けて、接点を変えた後の古い答えを見分ける。
      - {id: L2now, layer: now, field: living, scene: 誰と暮らしている？,
         choices: {A: 一人暮らし, B: 家族と暮らしている, C: 誰かとシェアしている, D: その他（自由記述）,
                   E: あなたと二人で暮らしている, F: あなたと、ほかの家族も一緒に暮らしている, G: あなたと、ほかの誰かも一緒に暮らしている（シェアなど）},
         contact_choices: {B2: [E, F, G, D], default: [A, B, C, D]}}
      - {id: L3now, layer: now, field: rhythm, scene: 一日のリズムは？,
         choices: {A: 朝型できっちり, B: 夜型でマイペース, C: 日によってばらばら, D: 仕事や用事に合わせて変わる}}
      - {id: L4now, layer: now, field: social, scene: 友だち付き合いは？,
         choices: {A: 広く浅く、いろんな人と付き合う, B: 少数の親しい人と深く, C: 一人の時間が多め, D: 場によって変わる}}

  - id: life
    title: これまでの人生
    description: 今につながる居場所・出会い・転機について、答えたいところだけ聞きます。
    source: input/AI_character_model/questionnaires/02_AUTHOR_LIFE_SEED_8_V0.1.md
    note: Q8（AI が過去を具体化してよい範囲）は v2 では項目ごとの「このまま／膨らませてよい」に置き換える

# 新しい領域（R01-R10）。CBS01-24 と同じく status を持ち、質問に答えなければ open。
relationship_domains:
  - {id: R01, label: 落ち込んでいる相手への寄り添い方}
  - {id: R02, label: 相手の良い知らせ}
  - {id: R03, label: 久しぶりの再会}
  - {id: R04, label: からかい・じゃれ合い}
  - {id: R05, label: 相手との意見の違い}
  - {id: R06, label: 気が進まない頼みごと（境界線）}
  - {id: R07, label: 相手がほかの人と親しくしている話}
  - {id: R08, label: 自分の望みを口にするか}
  - {id: R09, label: 相手の愚痴（味方するか）}
  - {id: R10, label: 話題がない時の振る舞い（自発性）}
