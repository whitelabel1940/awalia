<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Awalia パートナー</title>
<style>
/* Coordinates also define the native hit region in corner.rs (logical pixels). */
:root{font-family:"Yu Gothic UI",sans-serif;color:#38312f;color-scheme:light}
*{box-sizing:border-box}html,body{margin:0;width:100vw;height:100vh;background:transparent;overflow:hidden;user-select:none}
#partner{position:relative;width:calc(316px + var(--face-size,96px));height:max(140px,calc(var(--face-size,96px) + 24px));transform:scale(var(--corner-scale,1));transform-origin:0 0}
button{position:absolute;border:0;font:inherit;cursor:pointer;padding:0;touch-action:none}
#face{left:304px;bottom:12px;width:var(--face-size,96px);height:var(--face-size,96px);border-radius:50%;overflow:hidden;background:#eee3d9;color:#785f76;font-size:28px;border:2px solid #a28a9f}
#face img{width:100%;height:100%;object-fit:cover;pointer-events:none}
#portrait{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
#portrait img{position:absolute;inset:0}
#face.idle-motion #portrait{animation:idle-bob 7s ease-in-out infinite}
@keyframes idle-bob{0%,100%{transform:translateY(0) scale(1.04)}50%{transform:translateY(-1px) scale(1.04)}}
#bubble{left:8px;top:8px;width:284px;height:116px;border-radius:12px;padding:12px 16px;text-align:left;background:#faf6ef;color:#38312f;border:1px solid #c6b5c2}
#name{display:block;font-size:12px;color:#785f76;margin-bottom:5px}
#body{font-size:14px;line-height:1.5;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow-wrap:anywhere}
[hidden]{display:none!important}
@media(prefers-color-scheme:dark){#bubble{background:#312d30;color:#f4ede5;border-color:#9a8397}#name{color:#d5b9d1}#face{background:#312d30;color:#eadce7}}
</style>
<div id="partner">
<button id="bubble" hidden aria-label="会話を開く"><b id="name"></b><span id="body"></span></button>
<button id="face" aria-label="会話を開く。ドラッグして移動" title="押すと会話へ・ドラッグで移動"><span id="portrait"><span id="initial">○</span><img id="image" alt="" hidden draggable="false"><img id="blink-image" alt="" hidden draggable="false"></span></button>
</div>
<script type="module" src="corner.js"></script>
</html>
